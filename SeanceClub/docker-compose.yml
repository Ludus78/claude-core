# La base est initialisée avec db/migrations/*.sql au PREMIER démarrage du volume.
# Pour repartir de zéro : docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seance
      POSTGRES_PASSWORD: seance
      POSTGRES_DB: seanceclub
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
